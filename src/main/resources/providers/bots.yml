enabled: true
# Logs the resolved Match/KB profile and every Bot knockback bridge application.
debug: false
countdown-seconds: 3
match-time-limit-seconds: 600
return-to-lobby-delay-seconds: 3

# Legacy-only human response layer. NMS still performs the actual acceleration and friction.
legacy-movement:
  # A forced sprint restart is normally observed by the server about 1-2 ticks later.
  sprint-restart-delay-ticks: 2
  # Receiving KB keeps movement input, but delays its recovery to full strength.
  knockback-input-delay-ticks: 1
  knockback-input-scale: 0.35
  input-recovery-step: 0.5
  # Prevents the Bot from reversing A/D input at full strength in one tick.
  strafe-recovery-step: 0.21

profiles:
  # minreach/maxreach are the lower/upper bounds used to roll each melee attack's reach.
  # combat-distance controls when the Bot stops advancing; it is independent from attack reach.
  # 1.0 is normal player movement speed; values above 1.0 are intentionally faster.
  # tryhard: false stops combat against a disengaged opponent, but permits eating and drinking.
  # w-tap-rate is a probability: 0.65 means 65%; reaction time is milliseconds.
  # blockhit applies only in oldSwordBlockKB kits.
  easy:
    display-name: "&aEasy"
    icon: WOODEN_SWORD
    cps: 6.0
    maxreach: 2.0
    swing-range: 6.0
