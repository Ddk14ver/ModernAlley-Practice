# Default knockback profile
branch: DEFAULT
disable_downward_kb: false
horizontal:
  ground: 0.38
  air: 0.37
  # Vanilla 1.21.11 sprint bonus is ~62% of the base horizontal knockback (0.5/0.8 strength).
  # 原版1.21.11冲刺加成约为基础水平击退的62%（0.5/0.8强度），0.4/0.651 接近该比例。
  sprint_extra: 0.25
vertical:
  ground: 0.299
  air: 0.29
  sprint_extra: 0.05
hit_delay: 20
hit_delay_format: nms_window
y_limit: 2.6
stop_sprint: true
projectile:
  enabled: true
  horizontal: 0.25
  vertical: 0.20
  horizontal_multiplier: 1.0
  vertical_multiplier: 1.0
  direction_override: false
hitbox:
  length: 0.6
  height: 1.8
potion:
  enabled: false
  horizontal_multiplier: 1.0
  vertical_multiplier: 1.0
  compensation_multiplier: 1.0
  speed_compensation: 1.0
  horizontal_compensation: 0.0
  horizontal_offset: 0.0
  vertical_offset: 0.0
packet:
  misplace:
    enabled: true
    distance: 0.1
    normal_distance: 0.05
    hit_distance: 0.1
    hit_window_ticks: 4
    hit_compensation: true
    max_hit_compensation: 0.3
  delay:
    enabled: false
    ticks: 2
modern:
  cooldown_affects_kb: true
  entity_interaction_range: 3.0
